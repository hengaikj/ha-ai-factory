name: HA Governance

on:
  pull_request:
  push:
    branches: [master, feature/M01-foundation]

permissions:
  contents: read

jobs:
  gate:
    name: HA Governance / gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Run governance tests
        run: python -m unittest discover -s tests/governance -p 'test_*.py' -v

  backend:
    name: HA Governance / backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-ai-factory-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: mvn -q test

  frontend:
    name: HA Governance / frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-ai-factory-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ha-ai-factory-web/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests and build
        run: pnpm test -- --run && pnpm build

  runtime:
    name: HA Governance / agent-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-ai-agent-runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Run runtime tests
        run: python -m pytest -q
