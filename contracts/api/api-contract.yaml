openapi: 3.0.3
info:
  title: HA AI Software Factory API Contract
  version: 0.2.0-draft
  description: >-
    M02 Project / Member / Gate contract. Global Contract Gate is PASS.
    HD-002, HD-004, HD-005 and HD-006 remain explicitly deferred for M02.
    Laya Runtime inference is specified separately; its Contract Gate has passed,
    but real Runtime execution remains disabled for M02 under the HD-002 deferral.
x-contract-status: m02-scoped-approved-global-pass
x-deferred-decisions:
  HD-002: M02 does not enable real Agent Runtime execution or credentials.
  HD-004: Repository files are authoritative; system editing and file hosting are deferred.
  HD-005: M02 accepts default operational boundaries without formal SLA or retention guarantees.
  HD-006: M02 has no Git, CI, test orchestration, notification, or other external integrations.
servers:
  - url: https://{host}
    description: Deployment-specific host; environment values are configured outside this contract.
    variables:
      host:
        default: api.example.invalid
        description: Example only; replace with the approved deployment host.
security:
  - sessionCookie: []
x-csrf-protection:
  applies-to: all state-changing operations authenticated by sessionCookie
  header: X-CSRF-Token
  token-source: CurrentSession.csrfToken
  rejection: 403 application/problem+json
x-runtime-service-identity:
  issuer: Web backend
  audience: ha-ai-agent-runtime
  maximum-validity: PT10M
  forwarded-human-identity: authenticated OIDC issuer+subject; project and task context are mandatory
  browser-cookie-accepted-by-runtime: false
tags:
  - name: Authentication
  - name: Projects
  - name: Members
  - name: Tasks
  - name: Deliverables
  - name: Gates
  - name: OpenIssues
  - name: Resources
  - name: Activity
  - name: AgentRuntime
paths:
  /auth/login:
    get:
      tags: [Authentication]
      security: []
      summary: Begin enterprise OIDC sign-in
      description: >-
        The server starts Authorization Code + PKCE, creates one-time state and
        nonce values, and redirects to the deployment-configured OIDC issuer.
        No local-password flow is supported.
      responses:
        '302':
          description: Redirect to the configured OIDC authorization endpoint.
          headers:
            Location: { schema: { type: string, format: uri } }
        default: { $ref: '#/components/responses/Problem' }
  /auth/callback:
    get:
      tags: [Authentication]
      security: []
      summary: Complete enterprise OIDC sign-in
      description: >-
        The server validates state, nonce, issuer, signature, audience and the
        authorization code using the stored PKCE verifier. It resolves the
        authenticated identity by issuer+subject, rotates any prior session,
        sets the server-session cookie and redirects to the application.
        Authorization codes and tokens are never returned to browser script.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '303':
          description: Sign-in completed; session cookie set by the server.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string, description: Secure; HttpOnly; SameSite; server-managed session cookie. } }
        default: { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      tags: [Authentication]
      summary: Get the current authenticated principal
      responses:
        '200':
          description: Current authenticated user summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current server-side session
      description: Requires CSRF validation; clears the cookie and invalidates the server-side session immediately.
      responses:
        '204': { description: Session revoked and cookie cleared. }
        default: { $ref: '#/components/responses/Problem' }
  /projects:
    get:
      tags: [Projects]
      summary: List projects visible to the caller
      description: The authenticated principal sees only projects with active membership; roles are checked server-side.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: query
          in: query
          schema: { type: string, maxLength: 128 }
          description: Searches project name and description.
      responses:
        '200':
          description: Project page.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
                  total: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      summary: Create a project
      description: Any authenticated principal may create a project; the server assigns that caller the initial Owner membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: List project members and assigned roles
      responses:
        '200':
          description: Active members and roles, visible to a project Owner or Project Admin; revoked memberships remain in audit history only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Members]
      summary: Add an existing OIDC identity to a project
      description: >-
        Owner or Project Admin only. The identity must have authenticated at
        least once; clients cannot choose an arbitrary principalRef. At least
        one Owner must remain in the project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberCreate' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/members/{principalRef}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: principalRef
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Members]
      summary: Replace a project member's roles
      description: Owner or Project Admin only; role changes take effect immediately. The project must retain an Owner; ownerRef is reassigned to the earliest-joined remaining Owner if needed.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProjectMemberRolesUpdate' }
      responses:
        '200':
          description: Updated member roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Members]
      summary: Remove a project member
      description: Owner or Project Admin only; removal immediately revokes project access and cannot remove the last Owner. If the removed member is ownerRef, it is reassigned to the earliest-joined remaining Owner.
      responses:
        '204': { description: Membership revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project details
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Projects]
      summary: Update project metadata
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List tasks in a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: Task page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Tasks]
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Created task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Tasks]
      summary: Get task details
      responses:
        '200':
          description: Task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Tasks]
      summary: Update task assignment or status
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/deliverables:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Deliverables]
      summary: List project deliverables
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Deliverable page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverablePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Deliverables]
      summary: Register a deliverable
      description: For M02, repository files are authoritative; this operation stores only a repository reference, version, and optional content digest. System editing and file hosting are deferred under HD-004.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverableCreate' }
      responses:
        '201':
          description: Registered deliverable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
        default: { $ref: '#/components/responses/Problem' }
  /deliverables/{deliverableId}/reviews:
    parameters:
      - name: deliverableId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Deliverables]
      summary: Record an independent deliverable review
      description: The authenticated Reviewer must hold the project Reviewer role and pass the object-level independence check defined in HD-003.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverableReviewCreate' }
      responses:
        '201':
          description: Review recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverableReview' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/gates:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Gates]
      summary: List project gates
      responses:
        '200':
          description: Gates and check summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Gate' }
        default: { $ref: '#/components/responses/Problem' }
  /gates/{gateId}:
    parameters:
      - name: gateId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Gates]
      summary: Get gate and checklist details
      responses:
        '200':
          description: Gate details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gate' }
        default: { $ref: '#/components/responses/Problem' }
  /gates/{gateId}/submission:
    parameters:
      - name: gateId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Gates]
      summary: Submit a gate for independent review
      description: >-
        Owner, Project Admin, or Orchestrator may submit the evidence package
        before Reviewer checks begin. The server derives submittedByRef from the authenticated
        session, validates every scoped task/deliverable belongs to the gate's
        project, and records the designated decisionOwnerRef. At least one
        scoped task or deliverable is required. This action does not approve
        the gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateSubmissionCreate' }
      responses:
        '200':
          description: Gate queued for independent review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gate' }
        default: { $ref: '#/components/responses/Problem' }
  /gates/{gateId}/checks/{checkId}/decision:
    parameters:
      - name: gateId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: checkId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Gates]
      summary: Record a gate-check result
      description: >-
        The Gate must be READY_FOR_REVIEW. The authenticated Reviewer must hold
        the project Reviewer role and must
        not match the gate submitter, designated decision owner, any scoped
        task assignee, or any scoped deliverable submitter. The server derives
        this conflict set and rejects conflicts with REVIEW_CONFLICT; request
        fields cannot override it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckDecisionCreate' }
      responses:
        '200':
          description: Updated gate check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateCheck' }
        '403':
          description: Caller lacks Reviewer role or matches a principal in the Gate conflict snapshot.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /gates/{gateId}/decision:
    parameters:
      - name: gateId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Gates]
      summary: Submit final gate decision
      description: >-
        All Gate Checks must be complete. Only an authenticated human Reviewer
        with the project Reviewer role can decide. The server rejects the gate submitter, designated decision
        owner, any scoped task assignee, or any scoped deliverable submitter
        with REVIEW_CONFLICT. Agent and Orchestrator principals cannot approve.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateDecisionCreate' }
      responses:
        '200':
          description: Gate decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gate' }
        '403':
          description: Caller lacks Reviewer role or matches a principal in the Gate conflict snapshot.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stage-transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      summary: Advance a project after its required gate passes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPhase]
              properties:
                targetPhase: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Updated project phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [OpenIssues]
      summary: List project open issues
      responses:
        '200':
          description: Issues.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OpenIssue' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [OpenIssues]
      summary: Create an open issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenIssueCreate' }
      responses:
        '201':
          description: Created issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenIssue' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueId}/decisions:
    parameters:
      - name: issueId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [OpenIssues]
      summary: Record a human decision for an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, outcome]
              properties:
                decision: { type: string, minLength: 1, maxLength: 4000 }
                outcome: { type: string, enum: [DECIDED, TRACKING] }
      responses:
        '200':
          description: Updated issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenIssue' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Resources]
      summary: List project templates and rules
      parameters:
        - name: phase
          in: query
          schema: { type: string, maxLength: 64 }
        - name: kind
          in: query
          schema: { type: string, enum: [TEMPLATE, RULE] }
      responses:
        '200':
          description: Resource index.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectResource' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Activity]
      summary: List project audit activity
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: objectType
          in: query
          schema: { type: string, enum: [PROJECT, TASK, DELIVERABLE, GATE, OPEN_ISSUE, AGENT_RUN] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Activity page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/agent-runtime/config-status:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [AgentRuntime]
      summary: Get the execution-configuration status
      description: M02 exposes configuration status only. Real model/tool execution and credentials are disabled under the explicit HD-002 deferral.
      responses:
        '200':
          description: Runtime configuration status; secrets are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigStatus' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/tasks/{taskId}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: taskId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [AgentRuntime]
      summary: Request Agent Runtime execution (disabled in M02)
      description: >-
        M02 always fails closed and does not start real execution. Return
        CONFIG_NOT_APPROVED for every request because HD-002 execution is
        explicitly deferred; configuration is missing, unapproved, expired,
        or invalid states remain observable through config-status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey]
              properties:
                requestKey: { type: string, format: uuid }
      responses:
        '409':
          description: M02 execution is disabled under HD-002; no model, tool, or external side effect is started.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /agent-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [AgentRuntime]
      summary: Get Agent Runtime execution status and result
      responses:
        '200':
          description: Agent run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ha_session
      description: >-
        Server-managed session established through enterprise OIDC Authorization
        Code + PKCE. Secure, HttpOnly, SameSite, Path=/; 30-minute idle and
        8-hour
        absolute expiration. Mutating requests also require CSRF validation.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Problem:
      description: Error response.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CurrentSession:
      type: object
      required: [principalRef, displayName, csrfToken]
      properties:
        principalRef: { type: string, format: uuid }
        displayName: { type: string, maxLength: 256 }
        csrfToken: { type: string, minLength: 32, description: Opaque per-session token; send as X-CSRF-Token for state-changing requests. }
    ProjectMember:
      type: object
      required: [principalRef, displayName, roles, joinedAt]
      properties:
        principalRef: { type: string, format: uuid, description: Internal stable principal reference; OIDC issuer+subject are held server-side. }
        displayName: { type: string, maxLength: 256 }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProjectRole' }
        joinedAt: { type: string, format: date-time }
    ProjectMemberCreate:
      type: object
      required: [issuer, subject, roles]
      properties:
        issuer: { type: string, format: uri, maxLength: 512 }
        subject: { type: string, minLength: 1, maxLength: 512 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProjectRole' }
    ProjectMemberRolesUpdate:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProjectRole' }
    ProjectRole:
      type: string
      enum: [OWNER, PROJECT_ADMIN, ORCHESTRATOR, ENGINEER, REVIEWER]
    Project:
      type: object
      required: [id, name, ownerRef, currentPhase, gateStatus, openIssueCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 4000, nullable: true }
        techStack: { type: object, additionalProperties: { type: string } }
        ownerRef: { type: string, format: uuid, description: Stable internal principal reference for the current primary Owner; OIDC issuer+subject remain server-side. }
        currentPhase: { type: string, maxLength: 64 }
        gateStatus: { type: string, enum: [PENDING, APPROVED, RETURNED, BLOCKED, HUMAN_DECISION_REQUIRED] }
        openIssueCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 4000 }
        techStack: { type: object, additionalProperties: { type: string } }
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 4000, nullable: true }
        techStack: { type: object, additionalProperties: { type: string } }
    Task:
      type: object
      required: [id, projectId, title, phase, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        title: { type: string, maxLength: 256 }
        description: { type: string, maxLength: 8000, nullable: true }
        phase: { type: string, maxLength: 64 }
        assigneeRef: { type: string, format: uuid, nullable: true, description: Human or service principal; null means unassigned. }
        assigneeRole: { type: string, maxLength: 64, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
        deliverableIds:
          type: array
          items: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, READY_FOR_REVIEW, COMPLETED, RETURNED, BLOCKED, HUMAN_DECISION_REQUIRED]
    TaskCreate:
      type: object
      required: [title, phase]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 8000 }
        phase: { type: string, maxLength: 64 }
        assigneeRef: { type: string, format: uuid }
        assigneeRole: { type: string, maxLength: 64 }
        deliverableIds:
          type: array
          items: { type: integer, format: int64 }
    TaskUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 8000, nullable: true }
        assigneeRef: { type: string, format: uuid, nullable: true }
        assigneeRole: { type: string, maxLength: 64, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
        deliverableIds:
          type: array
          items: { type: integer, format: int64 }
    Deliverable:
      type: object
      required: [id, projectId, title, version, reviewStatus, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64, nullable: true }
        title: { type: string, maxLength: 256 }
        phase: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 64 }
        sourceRef: { type: string, maxLength: 2048, description: Repository file reference for M02; system editing and file hosting are deferred under HD-004. }
        reviewStatus: { type: string, enum: [DRAFT, PENDING, APPROVED, RETURNED, CLARIFICATION_REQUIRED] }
        createdAt: { type: string, format: date-time }
    DeliverableCreate:
      type: object
      required: [title, phase, version, sourceRef]
      properties:
        taskId: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 256 }
        phase: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 64 }
        sourceRef: { type: string, minLength: 1, maxLength: 2048, description: Repository file reference; must not be a public upload URL. }
    DeliverableReviewCreate:
      type: object
      required: [outcome, comment]
      properties:
        outcome: { type: string, enum: [APPROVED, RETURNED, CLARIFICATION_REQUIRED] }
        comment: { type: string, minLength: 1, maxLength: 4000 }
        evidenceRefs:
          type: array
          items: { type: string, maxLength: 2048 }
    DeliverableReview:
      allOf:
        - $ref: '#/components/schemas/DeliverableReviewCreate'
        - type: object
          required: [id, reviewerRef, createdAt]
          properties:
            id: { type: integer, format: int64 }
            reviewerRef: { type: string, format: uuid, description: Server-derived principal reference; never accepted from the request body. }
            createdAt: { type: string, format: date-time }
    DeliverablePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Deliverable' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Gate:
      type: object
      required: [id, projectId, phase, status, checks, submittedByRef, decisionOwnerRef, taskIds, deliverableIds]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        phase: { type: string, maxLength: 64 }
        status: { type: string, enum: [PENDING, READY_FOR_REVIEW, APPROVED, RETURNED, BLOCKED, HUMAN_DECISION_REQUIRED] }
        submittedByRef: { type: string, format: uuid, nullable: true, description: Server-derived Gate submission actor. }
        decisionOwnerRef: { type: string, format: uuid, nullable: true, description: Designated decision-responsible principal; cannot review this Gate. }
        taskIds: { type: array, items: { type: integer, format: int64 }, description: Tasks included in the Gate's conflict scope. }
        deliverableIds: { type: array, items: { type: integer, format: int64 }, description: Deliverables included in the Gate's conflict scope. }
        submittedAt: { type: string, format: date-time, nullable: true }
        reviewerRef: { type: string, format: uuid, nullable: true, description: Server-derived principal reference. }
        decisionComment: { type: string, maxLength: 4000, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        checks: { type: array, items: { $ref: '#/components/schemas/GateCheck' } }
    GateCheck:
      type: object
      required: [id, code, title, status]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 256 }
        status: { type: string, enum: [PENDING, PASSED, FAILED, CLARIFICATION_REQUIRED] }
        reviewerRef: { type: string, format: uuid, nullable: true, description: Server-derived Reviewer principal. }
        comment: { type: string, maxLength: 4000, nullable: true }
        evidenceRefs: { type: array, items: { type: string, maxLength: 2048 } }
    GateSubmissionCreate:
      type: object
      required: [decisionOwnerRef, taskIds, deliverableIds]
      additionalProperties: false
      properties:
        decisionOwnerRef: { type: string, format: uuid, description: Must reference an active member of the same project. }
        taskIds:
          type: array
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
        deliverableIds:
          type: array
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    CheckDecisionCreate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PASSED, FAILED, CLARIFICATION_REQUIRED] }
        comment: { type: string, maxLength: 4000 }
        evidenceRefs: { type: array, items: { type: string, maxLength: 2048 } }
    GateDecisionCreate:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, RETURNED, HUMAN_DECISION_REQUIRED] }
        comment: { type: string, maxLength: 4000 }
    OpenIssue:
      type: object
      required: [id, projectId, title, impact, decisionRole, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        code: { type: string, maxLength: 64, nullable: true }
        title: { type: string, maxLength: 256 }
        description: { type: string, maxLength: 8000 }
        impact: { type: string, maxLength: 4000 }
        decisionRole: { type: string, maxLength: 64 }
        status: { type: string, enum: [OPEN, HUMAN_DECISION_REQUIRED, DECIDED, TRACKING, CLOSED] }
        decision: { type: string, maxLength: 4000, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    OpenIssueCreate:
      type: object
      required: [title, description, impact, decisionRole]
      properties:
        code: { type: string, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, minLength: 1, maxLength: 8000 }
        impact: { type: string, minLength: 1, maxLength: 4000 }
        decisionRole: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [OPEN, HUMAN_DECISION_REQUIRED], default: OPEN }
    ProjectResource:
      type: object
      required: [id, kind, title, phase, version, sourceRef]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [TEMPLATE, RULE] }
        title: { type: string, maxLength: 256 }
        phase: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 64 }
        sourceRef: { type: string, maxLength: 2048, description: Repository file reference for the indexed template or rule. }
        sourceStatus: { type: string, enum: [CONFIRMED, PENDING_CONFIRMATION] }
    ActivityPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, objectType, objectId, action, actorRef, occurredAt]
            properties:
              id: { type: integer, format: int64 }
              objectType: { type: string, maxLength: 64 }
              objectId: { type: integer, format: int64 }
              action: { type: string, maxLength: 128 }
              beforeState: { type: string, nullable: true }
              afterState: { type: string, nullable: true }
              actorRef: { type: string, maxLength: 256 }
              comment: { type: string, maxLength: 4000, nullable: true }
              evidenceRefs: { type: array, items: { type: string, maxLength: 2048 } }
              occurredAt: { type: string, format: date-time }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    RuntimeConfigStatus:
      type: object
      required: [status, executionAllowed]
      properties:
        status: { type: string, enum: [UNCONFIGURED, PENDING_APPROVAL, REJECTED, EXPIRED, APPROVED, VALIDATION_FAILED] }
        executionAllowed: { type: boolean }
        modelRef: { type: string, maxLength: 128, nullable: true }
        toolRefs: { type: array, items: { type: string, maxLength: 128 } }
        permissionSummary: { type: string, maxLength: 2000, nullable: true }
        nextAction: { type: string, maxLength: 128, description: M02 returns CONFIG_NOT_APPROVED and directs the caller to the deferred-decision record. }
    AgentRun:
      type: object
      required: [id, projectId, taskId, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        resultSummary: { type: string, maxLength: 8000, nullable: true }
        errorCode: { type: string, maxLength: 128, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, enum: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, CONFLICT, REVIEW_CONFLICT, HUMAN_DECISION_REQUIRED, GATE_NOT_APPROVED, CONFIG_NOT_APPROVED] }
        decisionRef: { type: string, nullable: true, description: Open Issue or decision record reference. }
